  energy_func: null
  energy_lambda: 0.0
  autoencoder_n_iter: 1
  t_hard: 10
  use_cg_guidance: true
  property_ckpts:
    affinity: /path/to/models/properties/affinity.pt
    cycpep_proteolysis_sumscore: /path/to/models/properties/cycpep_proteolysis_sumscore.pt
    Pproxy: /path/to/models/properties/Pproxy.pt
    solubility_camsol_score: /path/to/models/properties/solubility_camsol_score.pt
    Sfinal: /path/to/models/properties/Sfinal.pt
