    affinity: 6
    cycpep_proteolysis_sumscore: 4
    Pproxy: 4
    solubility_camsol_score: 3
    Sfinal: 5
  guidance_grad_norm_balance: true
  guidance_grad_norm_eps: 1.0e-06
  guidance_grad_norm_ref: mean
  lambda_max: 0.3
  t_guidance_start: 30
  t_guidance_end: 5
