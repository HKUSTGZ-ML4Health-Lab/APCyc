# Paper-method defaults. Requires matching paper-profile AE/LDM.
cyc_enhance:
  enable_enlarged_vocab: true
  vocab_custom_map: null
  vocab_mode: paper
dataloader:
  batch_size_scope: per_device
  batch_size: 1
  num_workers: 4
  shuffle: true
  val_batch_size: 2
  wrapper:
    class: DynamicBatchWrapper
    complexity: n**2
    type_balanced: true
    type_target:
      HT: 0.25
      ISO: 0.5
      SS: 0.25
    type_total_samples: 35000
    ubound_per_batch: 60000
dataset:
  train:
    backbone_only: false
    class: CPCoreMMapDataset
    jsonl_path: /path/to/data/cpcore/metadata.jsonl
    mmap_dir: /path/to/data/cpcore/mmap
    return_sample_id: false
    return_supervision: true
    specify_index: /path/to/data/cpcore/mmap/train_index.txt
    use_covariance_matrix: true
  valid:
    backbone_only: false
    class: CPCoreMMapDataset
    jsonl_path: /path/to/data/cpcore/metadata.jsonl
    mmap_dir: /path/to/data/cpcore/mmap
    return_sample_id: false
    return_supervision: true
    specify_index: /path/to/data/cpcore/mmap/valid_index.txt
    use_covariance_matrix: true
lig_chain: L
model:
  autoencoder_ckpt: /path/to/models/autoencoder.pt
  autoencoder_no_randomness: false
  class: APCycLDMPepDesign
  cutoff: 1.0
  diffusion_opt:
    std: 10.0
  dist_rbf: 16
  dist_rbf_cutoff: 7.0
  hidden_size: 128
  loss_opt:
    enable_type_loss: true
    ignore_ht_pair_loss: false
    pair_loss_requires_type_match: false
    w_pair: 1.0
    w_type: 1.0
  max_gen_position: 64
  mode: codesign
  n_layers: 4
  n_rbf: 16
  num_steps: 100
  pair_opt:
    allow_ht_alt_pairs: false
    covalent_edge_separate_params: false
    covalent_edge_start_t: null
    covalent_edge_type_id: 3
    edge_type_dim: 16
    enable_covalent_edges: true
    enable_pair_injection: true
    enable_pocket_cross_attn: false
    ht_alt_min_end: 1
    lambda_b_max: 1.0
    lambda_cyc_max: 1.0
    lambda_cyc_schedule: linear
    lambda_g_max: 1.0
    mask_mode: teacher
    min_sep_ss: 3
    pair_anchor_channel_idx: 0
    pair_anchor_mode: ca
    pair_cyc_refine: true
    pair_cyc_refine_hidden: 64
    pair_dim: 128
    pair_head_hidden: 128
    pair_hidden_dim: 256
    pair_rbf_cutoff: 12.0
    pair_rbf_dim: 32
    pair_struct_dim: 64
    pair_struct_refine: true
    pair_struct_refine_hidden: 64
    pocket_cross_attn_dropout: 0.0
    relax_residue_constraints: false
    struct_proj_dim: 32
    type_hidden: 128
    chemistry_profile: paper
    topology_hard_start_t: 10
  h_loss_weight: 1.0
pdb_root: /path/to/data/cpcore/pdbs
rec_chain: R
sample_opt:
  autoencoder_n_iter: 1
  energy_func: null
  energy_lambda: 0.0
  guidance_w: null
  guidance_w_max: null
  guidance_w_min: null
  lambda_max: 0.0
  pbar: false
  property_ckpt: null
  return_pair_trajectory: false
  t_guidance_end: 0
  t_guidance_start: 0
  t_hard: 10
  use_cg_guidance: false
trainer:
  class: LDMTrainer
  config:
    max_epoch: 500
    metric_min_better: true
    optimizer:
      class: AdamW
      lr: 0.0001
    patience: 10
    save_dir: outputs/training/apcyc
    save_topk: 1
    scheduler:
      class: ReduceLROnPlateau
      factor: 0.6
      frequency: val_epoch
      min_lr: 5.0e-06
      mode: min
      patience: 3
    val_freq: 10
  criterion: Loss
