cyc_enhance:
  enable_enlarged_vocab: true
  vocab_mode: minimal
  vocab_custom_map: null

dataset:
  train:
    class: CPCoreMMapDataset
    mmap_dir: CPCore/cpcore_mmap
    specify_index: CPCore/cpcore_mmap/train_index.txt
    jsonl_path: cpcore_train.jsonl
    backbone_only: false
    return_supervision: false
    return_sample_id: false
  valid:
    class: CPCoreMMapDataset
    mmap_dir: CPCore/cpcore_mmap
    specify_index: CPCore/cpcore_mmap/valid_index.txt
    jsonl_path: cpcore_train.jsonl
    backbone_only: false
    return_supervision: false
    return_sample_id: false
    
load_ckpt: PepGlad_CPSea.ckpt

dataloader:
  batch_size: 1
  val_batch_size: 1
  shuffle: true
  num_workers: 4
  wrapper:
    class: DynamicBatchWrapper
    complexity: n**2
    ubound_per_batch: 60000

trainer:
  class: AutoEncoderTrainer
  config:
    max_epoch: 100
    save_topk: 5
    save_dir: ./ckpts/APCyc_AE
    patience: 10
    metric_min_better: true
    save_every_n_steps: 2000
    val_every_n_steps: 1000
    grad_norm_every_n_steps: 100
    throughput_every_n_steps: 100
    optimizer:
      class: AdamW
      lr: 1.0e-4
    scheduler:
      class: ReduceLROnPlateau
      factor: 0.8
      patience: 5
      mode: min
      frequency: val_epoch
      min_lr: 5.0e-6

model:
  class: AutoEncoder
  embed_size: 128
  hidden_size: 128
  latent_size: 8
  latent_n_channel: 4
  n_layers: 3
  n_channel: 14
  h_kl_weight: 0.3
  z_kl_weight: 0.5
  coord_loss_ratio: 0.5
  coord_loss_weights:
    Xloss: 1.0
    ca_Xloss: 1.0
    bb_bond_lengths_loss: 1.0
    sc_bond_lengths_loss: 1.0
    bb_dihedral_angles_loss: 0.0
    sc_chi_angles_loss: 0.5
  relative_position: false
  anchor_at_ca: false
  mask_ratio: 0.25
  enable_latent_anchor_channels: true
  latent_anchor_pad_atom: CA
  latent_anchor_strict: false
  latent_anchor_atoms:
    backbone: ["N", "CA", "C"]
    ss: ["SG"]
    iso_lys: ["NZ"]
    iso_asp: ["CG"]
    iso_glu: ["CD"]
